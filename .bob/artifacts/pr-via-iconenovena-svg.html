
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<style>
  body { background: #1a1a2e; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 0; flex-direction: column; }
  .row { display: flex; align-items: center; gap: 32px; margin: 24px 0; }
  .card { background: #2a2040; border-radius: 16px; padding: 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { color: #8b7daa; font-size: 12px; }
  .size { color: #e0d6f7; font-size: 14px; font-weight: 600; }
  /* FAB background (simulando o botão real) */
  .fab-bg { background: #5b2d82; border-radius: 50%; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; }
  /* Header background */
  .header-bg { background: #2a2040; border-radius: 8px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
  .header-title { color: #e0d6f7; font-size: 15px; font-weight: 700; }
  hr { width: 80%; border: none; border-top: 1px solid #3a2d5a; margin: 8px 0; }
  footer { color: #5a4d7a; font-size: 11px; border-top: 1px solid #3a2d5a; margin-top: 32px; padding-top: 12px; text-align: center; width: 80%; }
</style>
</head>
<body>
  <div class="row">
    <div class="card">
      <div class="label">FAB (28 × 28 px)</div>
      <div class="fab-bg">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#C89B3C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3a1 1 0 0 0-1 1v8"></path>
          <path d="M7 4a1 1 0 0 0-1 1v7"></path>
          <path d="M5 6a1 1 0 0 0-1 1v5.5"></path>
          <path d="M5 6c0-1-1-2-2-2S2 5 2 6v5c0 3.31 2.69 6 6 6h2"></path>
          <path d="M15 3a1 1 0 0 1 1 1v8"></path>
          <path d="M17 4a1 1 0 0 1 1 1v7"></path>
          <path d="M19 6a1 1 0 0 1 1 1v5.5"></path>
          <path d="M19 6c0-1 1-2 2-2s1 1 1 2v5c0 3.31-2.69 6-6 6h-2"></path>
          <path d="M10 11V4a1 1 0 0 1 2 0v7"></path>
          <path d="M14 11V4a1 1 0 0 0-2 0v7"></path>
          <path d="M10 17v2c0 1.1.9 2 2 2s2-.9 2-2v-2"></path>
        </svg>
      </div>
      <div class="size">28px — Botão flutuante</div>
    </div>

    <div class="card">
      <div class="label">Sheet Header (32 × 32 px)</div>
      <div class="header-bg">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" stroke="#C89B3C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3a1 1 0 0 0-1 1v8"></path>
          <path d="M7 4a1 1 0 0 0-1 1v7"></path>
          <path d="M5 6a1 1 0 0 0-1 1v5.5"></path>
          <path d="M5 6c0-1-1-2-2-2S2 5 2 6v5c0 3.31 2.69 6 6 6h2"></path>
          <path d="M15 3a1 1 0 0 1 1 1v8"></path>
          <path d="M17 4a1 1 0 0 1 1 1v7"></path>
          <path d="M19 6a1 1 0 0 1 1 1v5.5"></path>
          <path d="M19 6c0-1 1-2 2-2s1 1 1 2v5c0 3.31-2.69 6-6 6h-2"></path>
          <path d="M10 11V4a1 1 0 0 1 2 0v7"></path>
          <path d="M14 11V4a1 1 0 0 0-2 0v7"></path>
          <path d="M10 17v2c0 1.1.9 2 2 2s2-.9 2-2v-2"></path>
        </svg>
        <div class="header-title">Novenas</div>
      </div>
      <div class="size">32px — Cabeçalho do sheet</div>
    </div>

    <div class="card">
      <div class="label">Preview grande</div>
      <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" fill="none" stroke="#C89B3C" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3a1 1 0 0 0-1 1v8"></path>
        <path d="M7 4a1 1 0 0 0-1 1v7"></path>
        <path d="M5 6a1 1 0 0 0-1 1v5.5"></path>
        <path d="M5 6c0-1-1-2-2-2S2 5 2 6v5c0 3.31 2.69 6 6 6h2"></path>
        <path d="M15 3a1 1 0 0 1 1 1v8"></path>
        <path d="M17 4a1 1 0 0 1 1 1v7"></path>
        <path d="M19 6a1 1 0 0 1 1 1v5.5"></path>
        <path d="M19 6c0-1 1-2 2-2s1 1 1 2v5c0 3.31-2.69 6-6 6h-2"></path>
        <path d="M10 11V4a1 1 0 0 1 2 0v7"></path>
        <path d="M14 11V4a1 1 0 0 0-2 0v7"></path>
        <path d="M10 17v2c0 1.1.9 2 2 2s2-.9 2-2v-2"></path>
      </svg>
      <div class="size">96px — Zoom in</div>
    </div>
  </div>
  <footer>Made with IBM Bob</footer>
</body>
</html>
